<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLibrary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <ul class="nav-items">
        <li><a href="{{ url_for('index') }}"><span class="nav-icon">🏠</span></a></li>
        <li><a href="{{ url_for('create') }}"><span class="nav-icon">➕</span></a></li>
        <li><a href="#"><span class="nav-icon">📚</span></a></li>
        <li><a href="#"><span class="nav-icon">🗂️</span></a></li>
      </ul>
    </aside>
    <main class="main-content">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-container">
            {% for category, msg in messages %}
              <div class="flash {{ category }}">{{ msg }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
